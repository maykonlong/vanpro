# pg_hba do VanPro — conexao em claro NAO existe.
#
# A ordem e a regra: o PostgreSQL usa a PRIMEIRA linha que casa e nao olha as
# seguintes. Por isso as negativas vem antes das permissivas.
#
# TYPE       DATABASE  USER              ADDRESS       METHOD

# Socket unix, so de dentro do proprio container: e por aqui que o initdb, o
# pg_isready do healthcheck e o backup local falam com o servidor. Nao ha rede
# envolvida, entao nao ha o que cifrar.
local        all       all                             trust

# Sem TLS a conexao morre aqui, com mensagem clara — e nao "cai para texto
# claro em silencio", que e o comportamento que faz um vizinho comprometido na
# mesma rede docker ler senha e dado de crianca no fio.
hostnossl    all       all               all           reject

# Superusuario nao entra pela rede. Se o processo que precisa de superusuario
# nao roda dentro do container, ele nao deveria ser superusuario.
hostssl      all       postgres          all           reject

# Os dois papeis da aplicacao: dono do schema (migrations) e usuario de runtime.
# scram-sha-256 e nao md5: md5 e quebravel e o proprio projeto PostgreSQL o
# desencoraja desde a versao 10.
hostssl      all       vanpro_owner      all           scram-sha-256
hostssl      all       vanpro_app        all           scram-sha-256

# Qualquer outro papel, mesmo com TLS e senha certa, nao passa. Papel novo
# precisa ser escrito aqui — o que transforma "criei um usuario" numa decisao
# revisavel, e nao num acesso que aparece sozinho.
hostssl      all       all               all           reject
