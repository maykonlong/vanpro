# ─── Observabilidade — opt-in, fora do compose de producao ───────────────────
#
# Sobe um Prometheus que raspa o /api/v1/health/metrics do contêiner `api` pela
# rede interna do projeto. Fica separado de propósito: acrescentar isto ao
# `docker-compose.yml` mudaria a topologia do deploy sem decisão de ninguém, e
# um Prometheus mal configurado ao lado do banco é superfície nova.
#
#   docker compose -p vanpro-obs \
#     -f infra/observabilidade/docker-compose.observabilidade.yml up -d
#
# Requer, ANTES:
#   • a stack do VanPro no ar (é ela que cria a rede `vanpro_default`);
#   • as regras validadas:  promtool check rules infra/observabilidade/alertas.yml
#
# NÃO verificado contra host — é config correta contra os alvos lidos no código;
# a coleta real só se prova no servidor.

name: vanpro-obs

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vanpro-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
      # Com Prometheus externo, o token do /health/metrics entra por aqui, fora
      # do git (ver o comentário longo em prometheus.yml):
      #   printf '%s' "$METRICS_TOKEN" > infra/observabilidade/metrics_token
      # - ./metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_dados:/prometheus

    # Sem `ports`: o Prometheus fica só na rede interna, como o Postgres. Para
    # ver a UI, um túnel SSH (`ssh -L 9090:vanpro-prometheus:9090 …`) — nunca
    # publicado cru. Um Prometheus aberto entrega o mapa inteiro da aplicação:
    # que rotas existem, quanto tráfego cada uma recebe, quando o app cai.
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks: [vanpro]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: vanpro-grafana
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      # Senha do painel vem do ambiente, nunca do arquivo. Sem ela o Grafana
      # sobe com `admin/admin` — que e o mesmo que sem senha.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?defina GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina GRAFANA_PASSWORD}
      # Ninguem se cadastra sozinho num painel que mostra a operacao inteira.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # Sem telemetria para fora: o nome das rotas do produto e informacao.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./grafana/provisionamento:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisionamento:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/paineis:/etc/grafana/paineis:ro
      - grafana_dados:/var/lib/grafana

    # Sem `ports`, pelo mesmo motivo do Prometheus: o painel mostra o mapa
    # inteiro da operacao — quais rotas existem, quanto trafego cada uma recebe,
    # quando o sistema cai. Para abrir, tunel SSH:
    #   ssh -L 3001:vanpro-grafana:3000 usuario@servidor
    security_opt:
      - no-new-privileges:true
    networks: [vanpro]

networks:
  # A rede que o `docker-compose.yml` da raiz cria (projeto `vanpro`). Externa
  # aqui: este compose usa a rede, não a possui — se ela sumir, este stack falha
  # alto em vez de criar uma rede vazia e raspar o nada.
  vanpro:
    name: vanpro_default
    external: true

volumes:
  prometheus_dados:
  grafana_dados:
