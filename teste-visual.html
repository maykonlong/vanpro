<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANOS - Preview Visual (Modo Seguro)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel Standalone (Para compilar JSX no navegador sem precisar de Node.js/Binários) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons (Ícones via feather-icons para o modo standalone) -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    body { background-color: #020617; color: #f1f5f9; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Componente: Dashboard do Motorista (Ponto com 4 Batidas e Token)
    const DriverDashboard = () => {
      const [punchState, setPunchState] = useState(0); // 0: Início, 1: Saída Almoço, 2: Retorno Almoço, 3: Saída
      const [tokenModal, setTokenModal] = useState(false);
      const [token, setToken] = useState('');

      const punchLabels = ['Registrar Início de Turno', 'Registrar Saída p/ Almoço', 'Registrar Retorno Almoço', 'Registrar Fim de Turno', 'Turno Encerrado'];
      
      useEffect(() => {
        feather.replace();
      }, [punchState]);

      const handlePunch = () => {
        // Exemplo: se for pedir ajuste ou tentar bater fora do raio (simulação)
        // Aqui simularíamos a abertura do modal de token do gestor se houvesse bloqueio.
        if (punchState < 4) setPunchState(punchState + 1);
      };

      const handleToken = () => {
        if (token === '1234') {
          alert('Token aprovado pelo gestor! Ponto ajustado/liberado.');
          setTokenModal(false);
          setPunchState(punchState + 1);
        } else {
          alert('Token inválido!');
        }
      };

      return (
        <div className="max-w-md mx-auto space-y-6 p-4 mt-8">
          <div className="text-center mb-8">
            <h1 className="text-2xl font-bold text-emerald-400">App do Motorista</h1>
            <p className="text-slate-400">Van: PLACA-1234 • Rota Matutina</p>
          </div>

          {/* Cartão de Ponto */}
          <div className="glass-card rounded-xl p-6 shadow-xl">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-lg font-semibold flex items-center">
                <i data-feather="clock" className="w-5 h-5 mr-2 text-emerald-400"></i>
                Controle de Ponto
              </h2>
              <span className="text-xs bg-slate-800 px-2 py-1 rounded text-slate-300">Hoje</span>
            </div>

            <div className="space-y-4">
              {/* Linha do Tempo do Ponto */}
              <div className="flex justify-between text-xs text-slate-400 mb-6 relative">
                <div className="absolute top-1/2 left-0 w-full h-0.5 bg-slate-700 -z-10"></div>
                {['Início', 'Almoço (S)', 'Almoço (R)', 'Fim'].map((label, i) => (
                  <div key={label} className="flex flex-col items-center bg-slate-900 px-1">
                    <div className={`w-4 h-4 rounded-full mb-1 border-2 border-slate-900 ${punchState > i ? 'bg-emerald-500' : 'bg-slate-700'}`}></div>
                    <span>{label}</span>
                  </div>
                ))}
              </div>

              <button 
                onClick={handlePunch}
                disabled={punchState >= 4}
                className={`w-full py-4 rounded-lg font-bold text-lg flex items-center justify-center transition-all ${
                  punchState >= 4 ? 'bg-slate-800 text-slate-500' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.4)]'
                }`}
              >
                {punchLabels[punchState]}
              </button>

              {punchState > 0 && punchState < 4 && (
                <button 
                  onClick={() => setTokenModal(true)}
                  className="w-full py-2 mt-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm flex items-center justify-center"
                >
                  <i data-feather="shield" className="w-4 h-4 mr-2"></i> Solicitar Ajuste (Token do Gestor)
                </button>
              )}
            </div>
          </div>

          {/* Modal de Token */}
          {tokenModal && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="glass-card rounded-xl p-6 w-full max-w-sm">
                <h3 className="text-lg font-bold mb-2 flex items-center">
                  <i data-feather="key" className="w-5 h-5 mr-2 text-amber-400"></i> Autorização do Gestor
                </h3>
                <p className="text-sm text-slate-400 mb-4">Insira o token fornecido pelo gestor para liberar a batida fora do padrão ou ajuste de horário.</p>
                <input 
                  type="text" 
                  value={token}
                  onChange={e => setToken(token => e.target.value)}
                  placeholder="Token de 4 dígitos" 
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white mb-4 text-center tracking-widest text-xl"
                />
                <div className="flex gap-2">
                  <button onClick={() => setTokenModal(false)} className="flex-1 py-2 bg-slate-700 rounded-lg">Cancelar</button>
                  <button onClick={handleToken} className="flex-1 py-2 bg-amber-600 rounded-lg font-bold">Autorizar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // App Principal
    const App = () => {
      return (
        <div className="min-h-screen bg-slate-950 font-sans">
          <DriverDashboard />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
