# nginx.conf completo (e nao um trecho em conf.d): o container roda como
# usuario nao-root, entao o pid e os caminhos temporarios precisam sair de
# /var/run e /var/cache, que sao os unicos diretorios com escrita concedida.

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
  scgi_temp_path /var/cache/nginx/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Upload de foto: acima disso o proprio nginx corta antes de a API opinar.
  client_max_body_size 6m;

  # ---------------------------------------------------------------------
  # TLS
  # ---------------------------------------------------------------------
  # TLS 1.2 e o piso, e nao 1.0/1.1: os dois anteriores estao formalmente
  # depreciados (RFC 8996) e continuam ligados em muita configuracao antiga
  # justamente porque ninguem os desliga de proposito.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_session_cache shared:VanPro:10m;
  ssl_session_timeout 1d;
  # Ticket de sessao desligado: sem rotacao de chave ele enfraquece o sigilo
  # futuro, que e justamente o que o ECDHE acima existe para dar.
  ssl_session_tickets off;

  # Cabecalhos de seguranca em UM lugar so.
  #
  # `add_header` nao e herdado por um `location` que tenha o proprio
  # `add_header` — a pegadinha classica do nginx, que faz a CSP sumir
  # exatamente nas rotas mais acessadas. Reunindo tudo num arquivo incluido nos
  # dois blocos `server`, a lista nao se duplica nem diverge entre eles.
  include /etc/nginx/vanpro-seguranca.conf;

  # ---------------------------------------------------------------------
  # Porta em claro: existe apenas para mandar embora
  # ---------------------------------------------------------------------
  server {
    listen 8080;
    server_name _;

    # A sonda do compose bate aqui: um healthcheck que precisasse validar
    # certificado dentro do proprio container mediria o TLS, nao o nginx, e
    # falharia por motivo que nao tem nada a ver com a app estar de pe.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # 301 e nao 302: o permanente e o que o navegador guarda, e o que o HSTS
    # abaixo aproveita para nunca mais tentar HTTP.
    #
    # A porta aparece explicitamente porque nesta maquina o HTTPS publicado e
    # 8443 (a 443 ja esta ocupada por outra stack). Num servidor de verdade a
    # linha e `return 301 https://$host$request_uri;`.
    location / {
      return 301 https://$host:8443$request_uri;
    }
  }

  # ---------------------------------------------------------------------
  # A aplicacao, so em TLS
  # ---------------------------------------------------------------------
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    include /etc/nginx/vanpro-seguranca.conf;

    # HSTS so no bloco TLS: emitido em resposta HTTP pura, o navegador ignora —
    # e um cabecalho ignorado num relatorio parece uma garantia que existe.
    # 2 anos, com subdominios. `preload` fica de fora de proposito: entrar na
    # lista embutida do navegador e praticamente irreversivel, e essa e uma
    # decisao do dono do dominio, nao do arquivo de configuracao.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # API e realtime
    # ---------------------------------------------------------------------
    # Front e API na MESMA origem: o cookie de sessao e SameSite e nao
    # acompanharia uma chamada cross-site.
    # Metricas ficam na rede interna, onde o coletor vive. Sem esta negacao, o
    # `location /api` abaixo as publicaria junto com o resto — e metrica de
    # latencia por rota diz a um curioso exatamente que superficie existe e
    # quanto trafego cada parte recebe.
    location = /api/v1/health/metrics {
      deny all;
      return 404;
    }

    # Carimbo de versao: util para a operacao conferir qual imagem respondeu, e
    # util na mesma medida para quem procura uma versao com falha conhecida.
    location ^~ /api/v1/interno/ {
      deny all;
      return 404;
    }

    location /api {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # A API decide `Secure` no cookie e HSTS a partir deste cabecalho. Com
      # `$scheme` fixo em http (o proxy interno fala em claro com a API, que
      # esta na mesma rede docker), a sessao sairia sem Secure — por isso vai o
      # esquema que o NAVEGADOR usou, que e o que importa.
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }

    location /socket.io {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      # Socket ocioso nao pode ser cortado no meio da rota.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------
    # Estaticos e fallback de SPA
    # ---------------------------------------------------------------------
    # Assets do Vite tem hash no nome: cache longo e seguro.
    # `expires` e nao `add_header`: um `add_header` dentro do location apagaria
    # TODOS os cabecalhos de seguranca herdados do bloco server — a pegadinha
    # do nginx que faz CSP sumir justamente nas rotas mais acessadas.
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    # O HTML nunca e cacheado: senao um deploy novo continua servindo o
    # index antigo, que aponta para bundles que nao existem mais.
    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
