# nginx.conf completo (e nao um trecho em conf.d): o container roda como
# usuario nao-root, entao o pid e os caminhos temporarios precisam sair de
# /var/run e /var/cache, que sao os unicos diretorios com escrita concedida.

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
  scgi_temp_path /var/cache/nginx/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Upload de foto: acima disso o proprio nginx corta antes de a API opinar.
  client_max_body_size 6m;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # Cabecalhos de seguranca
    # ---------------------------------------------------------------------
    # Sem `unsafe-eval`: o bundle do Vite nao precisa dele, e permiti-lo
    # transforma qualquer injecao de string em execucao de codigo.
    # `style-src` mantem `unsafe-inline` porque o React aplica estilo inline
    # em atributo `style`; script inline continua proibido.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---------------------------------------------------------------------
    # Sonda
    # ---------------------------------------------------------------------
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # API e realtime
    # ---------------------------------------------------------------------
    # Front e API na MESMA origem: o cookie de sessao e SameSite e nao
    # acompanharia uma chamada cross-site.
    # Metricas ficam na rede interna, onde o coletor vive. Sem esta negacao, o
    # `location /api` abaixo as publicaria junto com o resto — e metrica de
    # latencia por rota diz a um curioso exatamente que superficie existe e
    # quanto trafego cada parte recebe.
    location = /api/v1/health/metrics {
      deny all;
      return 404;
    }

    # Carimbo de versao: util para a operacao conferir qual imagem respondeu, e
    # util na mesma medida para quem procura uma versao com falha conhecida.
    location ^~ /api/v1/interno/ {
      deny all;
      return 404;
    }

    location /api {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /socket.io {
      proxy_pass http://api:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Socket ocioso nao pode ser cortado no meio da rota.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------
    # Estaticos e fallback de SPA
    # ---------------------------------------------------------------------
    # Assets do Vite tem hash no nome: cache longo e seguro.
    # `expires` e nao `add_header`: um `add_header` dentro do location apagaria
    # TODOS os cabecalhos de seguranca herdados do bloco server — a pegadinha
    # do nginx que faz CSP sumir justamente nas rotas mais acessadas.
    location /assets/ {
      expires 1y;
      try_files $uri =404;
    }

    # O HTML nunca e cacheado: senao um deploy novo continua servindo o
    # index antigo, que aponta para bundles que nao existem mais.
    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
