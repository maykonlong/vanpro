# Cabecalhos de seguranca do VanPro — incluido pelos blocos `server`.
#
# Arquivo separado porque o nginx NAO herda `add_header` para um nivel que ja
# tem `add_header` proprio. Repetir a lista a mao nos dois `server` (o de
# redirecionamento e o de TLS) funcionaria hoje e divergiria no primeiro ajuste
# feito com pressa — e o bloco esquecido e sempre o que ninguem testa.
#
# `always` em todos: sem ele o cabecalho some justamente nas respostas de erro,
# que sao as que um atacante consegue provocar de proposito.

# Sem `unsafe-eval`: o bundle do Vite nao precisa dele, e permiti-lo
# transforma qualquer injecao de string em execucao de codigo.
# `style-src` mantem `unsafe-inline` porque o React aplica estilo inline
# em atributo `style`; script inline continua proibido.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# COEP fica de FORA de proposito: `require-corp` quebra qualquer recurso de
# terceiro sem CORP e o unico ganho seria isolamento de memoria compartilhada,
# que esta app nao usa. Ligar por ligar so produz tela branca.
