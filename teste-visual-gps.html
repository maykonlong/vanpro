<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <title>VANOS - Simulador Visual GPS (Stand-alone)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020617; color: white; font-family: system-ui, sans-serif; display: flex; gap: 2rem; padding: 2rem; justify-content: center; }
    .card { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 1.5rem; padding: 1.5rem; width: 350px; }
  </style>
</head>
<body>
  
  <!-- MOTORISTA -->
  <div class="card">
    <div class="text-center mb-6">
      <h2 class="text-xl font-bold text-white mb-2">Painel Motorista</h2>
      <p class="text-emerald-400 text-sm font-medium">Van 01 (Em Rota)</p>
    </div>
    
    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center mb-4">
      <p class="text-xs text-slate-400 mb-2">Seu GPS atual:</p>
      <div class="font-mono text-emerald-400 text-sm" id="driver-coords">
        Lat: <span id="d-lat">-23.55050</span><br>
        Lng: <span id="d-lng">-46.63330</span>
      </div>
    </div>

    <button id="btn-gps" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-colors">
      <i data-lucide="play"></i> Iniciar Transmissão
    </button>
  </div>

  <!-- PAIS -->
  <div class="card relative overflow-hidden">
    <!-- Efeito radar -->
    <div id="radar-pulse" class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-full -mr-16 -mt-16 animate-ping hidden"></div>

    <div class="text-center mb-6">
      <h2 class="text-xl font-bold text-white mb-2">App dos Pais</h2>
      <p class="text-slate-400 text-sm">Acompanhando Van 01</p>
    </div>

    <div class="bg-slate-950 p-6 rounded-xl border border-slate-800 text-center space-y-4">
      <i data-lucide="bus" id="bus-icon" class="w-10 h-10 mx-auto text-slate-600 transition-colors duration-500"></i>
      
      <div>
        <h3 id="parent-status" class="font-bold text-white">Aguardando Conexão...</h3>
        <p class="text-xs text-slate-500 mt-1">Nenhum sinal recebido</p>
      </div>

      <div id="parent-live-data" class="pt-4 border-t border-slate-800 hidden">
        <span class="text-[10px] uppercase font-bold text-emerald-500 mb-2 block flex items-center justify-center gap-1">
          <i data-lucide="activity" class="w-3 h-3"></i> Ao Vivo
        </span>
        <div class="font-mono text-slate-300 text-xs">
          Lat: <span id="p-lat">0</span><br>
          Lng: <span id="p-lng">0</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    let isSimulating = false;
    let lat = -23.55050;
    let lng = -46.63330;
    let simInterval;

    const btnGps = document.getElementById('btn-gps');
    const dLat = document.getElementById('d-lat');
    const dLng = document.getElementById('d-lng');
    const pLat = document.getElementById('p-lat');
    const pLng = document.getElementById('p-lng');
    
    const busIcon = document.getElementById('bus-icon');
    const parentStatus = document.getElementById('parent-status');
    const parentLiveData = document.getElementById('parent-live-data');
    const radarPulse = document.getElementById('radar-pulse');

    // MOCK: Em uma aplicação real o Socket.io faria essa ponte via Servidor
    // Aqui estamos simulando o evento 'gps_update' chegando no app dos pais
    function dispatchToParent(newLat, newLng) {
      // Atualiza UI Pais
      pLat.innerText = newLat.toFixed(5);
      pLng.innerText = newLng.toFixed(5);
      
      busIcon.classList.remove('text-slate-600');
      busIcon.classList.add('text-emerald-400');
      
      parentStatus.innerText = "Van em Movimento";
      parentStatus.previousElementSibling.innerText = "Sinal forte";
      
      parentLiveData.classList.remove('hidden');
      radarPulse.classList.remove('hidden');
    }

    btnGps.addEventListener('click', () => {
      if (isSimulating) {
        clearInterval(simInterval);
        isSimulating = false;
        btnGps.innerHTML = '<i data-lucide="play"></i> Iniciar Transmissão';
        btnGps.classList.replace('bg-red-600', 'bg-emerald-600');
        btnGps.classList.replace('hover:bg-red-500', 'hover:bg-emerald-500');
        
        busIcon.classList.add('text-slate-600');
        busIcon.classList.remove('text-emerald-400');
        parentStatus.innerText = "Transmissão Pausada";
        radarPulse.classList.add('hidden');
        lucide.createIcons();
      } else {
        isSimulating = true;
        btnGps.innerHTML = '<i data-lucide="square"></i> Parar';
        btnGps.classList.replace('bg-emerald-600', 'bg-red-600');
        btnGps.classList.replace('hover:bg-emerald-500', 'hover:bg-red-500');
        lucide.createIcons();

        // Loop a cada 1.5s
        simInterval = setInterval(() => {
          lat += (Math.random() - 0.5) * 0.001;
          lng += (Math.random() - 0.5) * 0.001;
          
          dLat.innerText = lat.toFixed(5);
          dLng.innerText = lng.toFixed(5);

          // Dispara para o "socket"
          dispatchToParent(lat, lng);
        }, 1500);
      }
    });
  </script>
</body>
</html>
