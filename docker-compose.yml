name: vanpro

services:
  postgres:
    image: postgres:16-alpine
    container_name: vanpro-postgres
    environment:
      POSTGRES_USER: vanpro
      POSTGRES_PASSWORD: vanpro_local_dev
      POSTGRES_DB: vanpro
      # Locale pt-BR para ordenacao correta de nomes com acento
      LANG: pt_BR.utf8
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanpro -d vanpro"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Postgres so escuta em localhost do host: banco exposto na internet e
    # como a maioria dos vazamentos comeca.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    container_name: vanpro-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations em servico proprio, de execucao unica.
  #
  # Rodar `migrate deploy` no comando da API pareceria mais simples, mas com N
  # replicas as N tentariam migrar ao mesmo tempo, e um filesystem read-only
  # teria de ser afrouxado so por causa disso. Aqui a migracao acontece uma vez,
  # e a API so sobe se ela tiver terminado bem.
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vanpro-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vanpro:vanpro_local_dev@postgres:5432/vanpro?schema=public
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vanpro-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # APP_ENV separado: a imagem e a de producao, mas rodando na maquina do
      # desenvolvedor as travas de producao (https obrigatorio, RP_ID publico)
      # so atrapalhariam. Em servidor, defina APP_ENV=production no .env.
      APP_ENV: ${APP_ENV:-local}
      PORT: 3000
      DATABASE_URL: postgresql://vanpro:vanpro_local_dev@postgres:5432/vanpro?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env da raiz}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env da raiz}
      PRISMA_FIELD_ENCRYPTION_KEY: ${PRISMA_FIELD_ENCRYPTION_KEY:?defina PRISMA_FIELD_ENCRYPTION_KEY no .env da raiz}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?defina WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?defina WEBAUTHN_ORIGIN}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/storage/uploads
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: vanpro-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    read_only: true
    # O tmpfs monta POR CIMA do diretorio que a imagem ja preparou, e o ponto de
    # montagem nasce como root:root — o chown do Dockerfile e perdido e o nginx
    # nao-root morre no primeiro arquivo temporario. Por isso o modo explicito.
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  uploads:
