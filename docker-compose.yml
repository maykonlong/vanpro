name: vanpro

# ─── Producao simulada, e nao "dev com jeito de producao" ───────────────────
#
# Esta stack sobe com APP_ENV=production e TODAS as travas ligadas: front so em
# TLS, banco so em TLS com certificado verificado, papel de runtime sem
# privilegio de DDL. Nada aqui e afrouxado "porque e local" — o ambiente que se
# afrouxa para caber e o ambiente que nao prova nada sobre o servidor.
#
# Antes do primeiro `up`:
#   node infra/scripts/gen-secrets.mjs --write
#   bash infra/scripts/gerar-certificados.sh
#
# Endereco: https://vanpro.localhost:8443  (a 8080 so redireciona)

services:
  postgres:
    image: postgres:16-alpine
    container_name: vanpro-postgres
    # O entrypoint proprio copia o material de TLS para dentro do container e
    # ajusta dono e modo antes de o servidor subir: o PostgreSQL recusa chave
    # privada legivel por outros, e num bind mount vindo do Windows todo
    # arquivo aparece 0777.
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-tls.sh"]
    environment:
      # O superusuario existe, mas o pg_hba o recusa pela rede: ele so responde
      # no socket unix de dentro do container.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?defina POSTGRES_SUPER_PASSWORD no .env da raiz}
      POSTGRES_DB: vanpro
      # Consumidos por infra/postgres/init/00-papeis.sh.
      VANPRO_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?defina POSTGRES_OWNER_PASSWORD no .env da raiz}
      VANPRO_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?defina POSTGRES_APP_PASSWORD no .env da raiz}
      # scram-sha-256 explicito: e o default do PG16, mas depender de default
      # significa que um downgrade de imagem volta a md5 sem ninguem notar.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      # Locale pt-BR para ordenacao correta de nomes com acento
      LANG: pt_BR.utf8
    ports:
      # 127.0.0.1 e nao 0.0.0.0: sem o prefixo, o Docker publica a porta em
      # TODAS as interfaces e o banco fica visivel para a rede local inteira —
      # inclusive o Wi-Fi da cafeteria. Banco exposto e como a maioria dos
      # vazamentos comeca.
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_dados_prod:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/entrypoint-tls.sh:/usr/local/bin/entrypoint-tls.sh:ro
      - ./infra/postgres/pg_hba.conf:/etc/vanpro/pg_hba.conf:ro
      - ./infra/certs/db:/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vanpro"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - postgres
      # ─── TLS obrigatorio ───────────────────────────────────────────────
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/var/lib/postgresql/tls/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      # ─── Dimensionamento coerente com o pool da aplicacao ──────────────
      #
      # 100 e nao 200: cada conexao no PostgreSQL e um processo, e 200 slots
      # ociosos custam memoria de verdade enquanto a aplicacao real abre ~15.
      # A conta que fecha aqui:
      #   API (connection_limit=15) + migrate (5, transitorio)
      #   + suite de testes rodando no host (~10) + psql/pg_dump do operador
      #   ≈ 35 no pico. O resto e folga para nao derrubar o banco num incidente.
      # Numero grande demais nao e generosidade: e um limite que nunca avisa
      # antes de a maquina comecar a paginar.
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      # Regra pratica: ~75% da memoria que o SO tem para cache. Nao aloca nada,
      # so informa o planejador — deixar no default de 4GB num container de 2GB
      # faz o planejador escolher varredura de indice onde sequencial seria
      # melhor.
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - log_min_duration_statement=500
      # ─── Nenhuma consulta segura o banco para sempre ───────────────────
      #
      # O default e ZERO, que significa "sem limite" — e o silencio aqui vale
      # pelo valor perigoso. Uma consulta que degenerou (falta de indice,
      # parametro inesperado, junção nova) prende a conexao, o pool esvazia e o
      # produto inteiro para por causa de uma tela.
      #
      # 30s e folgado para tudo que este produto faz de verdade: o DRE de seis
      # meses da maior frota responde em milissegundos. Se algo passar disso,
      # e defeito — e a resposta certa e cortar, com erro visivel, em vez de
      # arrastar o banco junto.
      - -c
      - statement_timeout=30000
      # Transacao aberta e esquecida segura tuplas mortas e trava o autovacuum;
      # e o caminho mais comum para o disco encher sem ninguem entender por que.
      - -c
      - idle_in_transaction_session_timeout=60000
      # Conexao rejeitada por pg_hba precisa aparecer no log, senao "a API nao
      # conecta" vira uma tarde de adivinhacao.
      - -c
      - log_connections=on

  redis:
    image: redis:7-alpine
    container_name: vanpro-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Migrations em servico proprio, de execucao unica.
  #
  # Rodar `migrate deploy` no comando da API pareceria mais simples, mas com N
  # replicas as N tentariam migrar ao mesmo tempo, e um filesystem read-only
  # teria de ser afrouxado so por causa disso. Aqui a migracao acontece uma vez,
  # e a API so sobe se ela tiver terminado bem.
  #
  # E o UNICO servico que fala com o banco como `vanpro_owner`: DDL vive aqui e
  # so aqui. A API roda como `vanpro_app`, que nao consegue criar nem apagar
  # tabela nenhuma — uma injecao de SQL bem-sucedida na API le dado, mas nao
  # apaga o schema.
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vanpro-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vanpro_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/vanpro?schema=public&sslmode=require&sslcert=/certs/ca.crt&sslaccept=strict&connection_limit=5
    volumes:
      - ./infra/certs/db:/certs:ro
    entrypoint: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: vanpro-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      # Sem `:-local`: o default silencioso e o que fazia esta stack rodar com
      # as travas de producao desligadas achando que estavam ligadas. Se a
      # variavel nao veio, o compose para aqui e diz o que falta.
      APP_ENV: ${APP_ENV:?defina APP_ENV=production no .env da raiz}
      PORT: 3000
      # `sslaccept=strict` e o que transforma "cifrado" em "cifrado E
      # autenticado": sem ele o cliente aceita QUALQUER certificado, e um
      # vizinho comprometido na rede docker se passa pelo banco sem esforco.
      # `sslcert` aponta a CA local — a mesma ancora que assina o certificado
      # que o servidor apresenta.
      DATABASE_URL: postgresql://vanpro_app:${POSTGRES_APP_PASSWORD}@postgres:5432/vanpro?schema=public&sslmode=require&sslcert=/certs/ca.crt&sslaccept=strict&connection_limit=15&pool_timeout=20
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL no .env da raiz}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env da raiz}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env da raiz}
      PRISMA_FIELD_ENCRYPTION_KEY: ${PRISMA_FIELD_ENCRYPTION_KEY:?defina PRISMA_FIELD_ENCRYPTION_KEY no .env da raiz}
      # Chaves antigas, so para LEITURA, durante uma rotacao em andamento.
      # Vazio no dia a dia. Ver docs/CRIPTOGRAFIA.md.
      PRISMA_FIELD_DECRYPTION_KEYS: ${PRISMA_FIELD_DECRYPTION_KEYS:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?defina WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:?defina WEBAUTHN_ORIGIN}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/storage/uploads
      - ./infra/certs/db:/certs:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: vanpro-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 8443 e nao 443 nesta maquina: a 443 ja esta ocupada por outra stack. Em
      # servidor, publique 80:8080 e 443:8443 e ajuste o `return 301` do nginx.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      # Certificado montado, e nao copiado para a imagem: chave privada dentro
      # de camada de imagem viaja junto com a imagem para todo lugar onde ela
      # for parar, e nao ha como tira-la de la depois.
      - ./infra/certs/web:/etc/nginx/certs:ro
    restart: unless-stopped
    read_only: true
    # O tmpfs monta POR CIMA do diretorio que a imagem ja preparou, e o ponto de
    # montagem nasce como root:root — o chown do Dockerfile e perdido e o nginx
    # nao-root morre no primeiro arquivo temporario. Por isso o modo explicito.
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  # Nome NOVO de proposito (era `pg_data`).
  #
  # Os papeis `vanpro_owner` e `vanpro_app` nascem no script de init, e o
  # entrypoint do PostgreSQL so roda os scripts de init com o diretorio de dados
  # VAZIO. Reaproveitar o volume antigo — que foi criado quando o superusuario
  # se chamava `vanpro` — daria um banco sem os papeis novos e uma API que nao
  # conecta, com a mensagem apontando para senha em vez de para o volume.
  #
  # O volume antigo continua no disco, intacto. Depois de conferir que nao ha
  # nada a resgatar nele:  docker volume rm vanpro_pg_data
  pg_dados_prod:
  redis_data:
  uploads:
