version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vanpro_postgres
    restart: always
    environment:
      POSTGRES_USER: vanpro_user
      POSTGRES_PASSWORD: vanpro_password
      POSTGRES_DB: vanpro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vanpro_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
    container_name: vanpro_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://vanpro_user:vanpro_password@postgres:5432/vanpro_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_vanpro_key_123
      - PORT=3000
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: vanpro_web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
