<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VanPro - Sistema Operacional de Vans, Escolar e Fretes</title>
    <!-- PWA Manifest & Colors -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: { 950: '#090d16', 900: '#0f172a', 800: '#1e293b' }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #090d16;
        color: #f1f5f9;
      }
      .glass-panel {
        background: rgba(15, 23, 42, 0.75);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-card {
        background: rgba(30, 41, 59, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover {
        border-color: rgba(16, 185, 129, 0.3);
        transform: translateY(-2px);
      }
      .glow-emerald {
        box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.35);
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.344.0"
        }
      }
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
        });
      }
    </script>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'react';
      import { createRoot } from 'react-dom/client';
      import { 
        Bus, Users, MapPin, DollarSign, AlertCircle, Wrench, Package, 
        TrendingUp, Calendar, ArrowUpRight, ArrowDownRight, CheckCircle2, Clock, Sparkles,
        Navigation, CheckCircle, XCircle, Phone, ShieldCheck, AlertTriangle, Bell, Plus, Trash2, Home, UserCheck, Fuel, FileText, Send, MessageSquare, Camera, Share2, BarChart3, Megaphone,
        QrCode, Receipt, Compass, Lock, CheckSquare, Layers, Smartphone, Zap
      } from 'lucide-react';

      const API_BASE = '/api/v1';

      // 1. Painel do Frotista Conectado (Fases 1 a 9)
      function OwnerDashboard({ onOpenAiSimulator, onOpenFreightCalc }) {
        const [subTab, setSubTab] = useState('MAIN'); // MAIN, FLEET, CRM, WHATSAPP, OCCURRENCES, MARKETING, BI, PIX_NFSE, PAYROLL, ROUTE_OPT
        const [vehicles, setVehicles] = useState([]);
        const [students, setStudents] = useState([]);
        const [maintenances, setMaintenances] = useState([]);
        const [crmLeads, setCrmLeads] = useState([]);
        const [contracts, setContracts] = useState([]);
        const [notifications, setNotifications] = useState([]);
        const [occurrences, setOccurrences] = useState([]);
        const [socialPosts, setSocialPosts] = useState([]);
        const [biData, setBiData] = useState(null);
        const [pixPayments, setPixPayments] = useState([]);
        const [nfseRecords, setNfseRecords] = useState([]);
        const [payrolls, setPayrolls] = useState([]);
        const [optimizedRoute, setOptimizedRoute] = useState(null);
        const [dre, setDre] = useState({ totalIncome: 0, totalExpense: 0, netProfit: 0, margin: 0 });
        const [selectedDay, setSelectedDay] = useState('MON');

        // Modais
        const [showFuelModal, setShowFuelModal] = useState(false);
        const [fuelData, setFuelData] = useState({ vehicleId: 'v1', kmAtFill: 43200, liters: 65, pricePerLiter: 5.95, stationName: 'Posto Shell Rota 101' });

        const [showPostModal, setShowPostModal] = useState(false);
        const [newPost, setNewPost] = useState({ title: 'Vagas 2026 - Escola Exemplo', targetSchool: 'Colégio Dom Pedro II', neighborhood: 'Jardins / Bela Vista', availableSeats: 4 });

        const loadData = async () => {
          try {
            setVehicles(await (await fetch(`${API_BASE}/vehicles`)).json());
            setStudents(await (await fetch(`${API_BASE}/students?dayOfWeek=${selectedDay}`)).json());
            setMaintenances(await (await fetch(`${API_BASE}/vehicles/maintenances`)).json());
            setCrmLeads(await (await fetch(`${API_BASE}/crm/leads`)).json());
            setContracts(await (await fetch(`${API_BASE}/contracts`)).json());
            setNotifications(await (await fetch(`${API_BASE}/notifications/whatsapp`)).json());
            setOccurrences(await (await fetch(`${API_BASE}/occurrences`)).json());
            setSocialPosts(await (await fetch(`${API_BASE}/marketing/posts`)).json());
            setBiData(await (await fetch(`${API_BASE}/bi/analytics`)).json());
            setPixPayments(await (await fetch(`${API_BASE}/financial/pix`)).json());
            setNfseRecords(await (await fetch(`${API_BASE}/financial/nfse`)).json());
            setPayrolls(await (await fetch(`${API_BASE}/drivers/payroll`)).json());
            setDre(await (await fetch(`${API_BASE}/financial/dre`)).json());
          } catch (err) {
            console.error('Erro ao carregar dados:', err);
          }
        };

        useEffect(() => { loadData(); }, [selectedDay]);

        const handleGeneratePix = async (studentId) => {
          const res = await fetch(`${API_BASE}/financial/pix/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ studentId }),
          });
          const pix = await res.json();
          alert(`⚡ QR Code Pix gerado para ${pix.studentName}! Código Copia e Cola disponível.`);
          loadData();
        };

        const handleSimulatePixWebhook = async (txid) => {
          const res = await fetch(`${API_BASE}/financial/pix/webhook`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ txid }),
          });
          const data = await res.json();
          alert(`✅ Webhook Pix Processado! Pagamento de ${data.confirmed.studentName} baixado e lançado no DRE.`);
          loadData();
        };

        const handleIssueNfse = async (studentId, monthlyFee) => {
          const res = await fetch(`${API_BASE}/financial/nfse/issue`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ studentId, amount: monthlyFee, description: 'Serviço de Transporte Escolar Mensal' }),
          });
          const nf = await res.json();
          alert(`📜 Nota Fiscal Eletrônica ${nf.number} emitida com sucesso! Código de validação: ${nf.verificationCode}`);
          loadData();
        };

        const handleRunOptimizeRoute = async () => {
          const res = await fetch(`${API_BASE}/routes/optimize`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ vehicleId: 'v1', dayOfWeek: selectedDay }),
          });
          const opt = await res.json();
          setOptimizedRoute(opt);
          alert(`🗺️ Rota otimizada! Redução de ${opt.savedDistanceKm} km (${opt.timeSavedMinutes} minutos economizados).`);
        };

        const handleLogFuel = async (e) => {
          e.preventDefault();
          const res = await fetch(`${API_BASE}/vehicles/fuel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(fuelData),
          });
          const log = await res.json();
          if (log.isConsumptionAnomaly) {
            alert(`⚠️ ALERTA DE ANOMALIA: Consumo calculado em ${log.calculatedKmPerLiter} km/L está >15% abaixo da média!`);
          } else {
            alert(`✅ Abastecimento registrado com sucesso! Média: ${log.calculatedKmPerLiter} km/L.`);
          }
          setShowFuelModal(false);
          loadData();
        };

        const handleCreatePost = async (e) => {
          e.preventDefault();
          const res = await fetch(`${API_BASE}/marketing/posts`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newPost),
          });
          const created = await res.json();
          alert(`📢 Anúncio para ${created.targetSchool} gerado com link WhatsApp pronto para compartilhar!`);
          setShowPostModal(false);
          loadData();
        };

        return (
          <div className="space-y-6">
            {/* Top Bar */}
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 glass-panel p-6 rounded-2xl">
              <div>
                <div className="flex items-center gap-2 text-emerald-400 font-semibold text-sm mb-1">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  Fases 1 a 9 Ativas em Produção (PWA + Auth + BI + Pix + Roteirizador)
                </div>
                <h1 className="text-2xl lg:text-3xl font-extrabold tracking-tight text-white">
                  Painel do Frotista — TransVan SaaS
                </h1>
                <p className="text-slate-400 text-sm">
                  Frota, Manutenções, CRM, Contratos, Pix Automático, NFS-e, Fechamento de Diárias e Roteirização.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button onClick={() => setShowFuelModal(true)} className="flex items-center gap-1.5 bg-amber-600 hover:bg-amber-500 text-white px-3.5 py-2 rounded-xl font-bold text-xs shadow-lg">
                  <Fuel className="w-4 h-4" /> + Abastecimento
                </button>
                <button onClick={() => setShowPostModal(true)} className="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl font-bold text-xs shadow-lg">
                  <Megaphone className="w-4 h-4" /> + Gerar Post Mkt
                </button>
                <button onClick={onOpenFreightCalc} className="flex items-center gap-1.5 bg-slate-800 text-slate-200 border border-slate-700 px-3.5 py-2 rounded-xl font-bold text-xs">
                  <Package className="w-4 h-4 text-purple-400" /> Cotar Frete
                </button>
              </div>
            </div>

            {/* Navegação de Sub-Abas de Todas as 9 Fases */}
            <div className="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1.5 rounded-2xl overflow-x-auto">
              <button onClick={() => setSubTab('MAIN')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'MAIN' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <Bus className="w-4 h-4" /> Visão Geral & DRE
              </button>
              <button onClick={() => setSubTab('FLEET')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'FLEET' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <Wrench className="w-4 h-4" /> F1: Manutenção
              </button>
              <button onClick={() => setSubTab('CRM')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'CRM' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <Users className="w-4 h-4" /> F2: CRM ({crmLeads.length})
              </button>
              <button onClick={() => setSubTab('WHATSAPP')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'WHATSAPP' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <MessageSquare className="w-4 h-4" /> F3: WhatsApp ({notifications.length})
              </button>
              <button onClick={() => setSubTab('OCCURRENCES')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'OCCURRENCES' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <Camera className="w-4 h-4" /> F4: Ocorrências ({occurrences.length})
              </button>
              <button onClick={() => setSubTab('MARKETING')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'MARKETING' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <Share2 className="w-4 h-4" /> F5: Posts Mkt ({socialPosts.length})
              </button>
              <button onClick={() => setSubTab('BI')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'BI' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <BarChart3 className="w-4 h-4" /> F6: BI Analytics
              </button>
              <button onClick={() => setSubTab('PIX_NFSE')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'PIX_NFSE' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <QrCode className="w-4 h-4 text-emerald-400" /> F7: Pix & NFS-e ({pixPayments.length})
              </button>
              <button onClick={() => setSubTab('PAYROLL')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'PAYROLL' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <DollarSign className="w-4 h-4 text-amber-400" /> F8: Diárias & Ponto
              </button>
              <button onClick={() => setSubTab('ROUTE_OPT')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${subTab === 'ROUTE_OPT' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>
                <Compass className="w-4 h-4 text-cyan-400" /> F9: Roteirizador
              </button>
            </div>

            {/* FASE PRINCIPAL: VISÃO GERAL & DRE */}
            {subTab === 'MAIN' && (
              <div className="space-y-6">
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="glass-card p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 font-semibold uppercase">Vans Na Frota</span>
                    <div className="text-2xl font-bold text-white mt-1">{vehicles.length}</div>
                  </div>
                  <div className="glass-card p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 font-semibold uppercase">Alunos Cadastrados</span>
                    <div className="text-2xl font-bold text-white mt-1">{students.length}</div>
                  </div>
                  <div className="glass-card p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 font-semibold uppercase">Receita DRE</span>
                    <div className="text-2xl font-bold text-emerald-400 mt-1">R$ {dre.totalIncome.toLocaleString('pt-BR')}</div>
                  </div>
                  <div className="glass-card p-4 rounded-xl border border-slate-800">
                    <span className="text-xs text-slate-400 font-semibold uppercase">Lucro Operacional</span>
                    <div className="text-2xl font-bold text-emerald-300 mt-1">R$ {dre.netProfit.toLocaleString('pt-BR')}</div>
                  </div>
                </div>

                {/* Seletor de Dia da Guarda Compartilhada */}
                <div className="glass-panel p-4 rounded-2xl flex items-center justify-between">
                  <span className="text-xs font-bold text-white uppercase flex items-center gap-2">
                    <Calendar className="w-4 h-4 text-emerald-400" /> Endereços do Dia (Guarda Compartilhada):
                  </span>
                  <div className="flex gap-1">
                    {['MON', 'TUE', 'WED', 'THU', 'FRI'].map(d => (
                      <button key={d} onClick={() => setSelectedDay(d)} className={`px-3 py-1 rounded-lg text-xs font-bold ${selectedDay === d ? 'bg-emerald-500 text-slate-950 font-extrabold' : 'bg-slate-900 text-slate-400'}`}>
                        {d === 'MON' ? 'Seg' : d === 'TUE' ? 'Ter' : d === 'WED' ? 'Qua' : d === 'THU' ? 'Qui' : 'Sex'}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Tabela de Alunos com Cobrança WhatsApp e Contrato Digital */}
                <div className="glass-panel p-6 rounded-2xl space-y-4">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Users className="w-5 h-5 text-blue-400" /> Alunos & Endereço Calculado de Hoje
                  </h2>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-900 text-slate-400 uppercase border-b border-slate-800">
                        <tr>
                          <th className="p-3">Aluno</th>
                          <th className="p-3">Endereço de Embarque de Hoje</th>
                          <th className="p-3">Mensalidade</th>
                          <th className="p-3 text-right">Ações Rápidas</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {students.map(s => (
                          <tr key={s.id} className="hover:bg-slate-900/40">
                            <td className="p-3 font-bold text-white">{s.name}</td>
                            <td className="p-3 text-emerald-300 font-medium">{s.todayPickupAddress} ({s.todayAddressLabel})</td>
                            <td className="p-3 font-bold text-emerald-400">R$ {s.monthlyFee.toLocaleString('pt-BR')}</td>
                            <td className="p-3 text-right flex justify-end gap-2">
                              <button onClick={() => handleSendWhatsappCharge(s)} className="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-lg font-bold flex items-center gap-1">
                                <Send className="w-3 h-3" /> Cobrar Pix WhatsApp
                              </button>
                              <button onClick={() => handleGenerateContract(s.id)} className="px-2.5 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/30 rounded-lg font-bold flex items-center gap-1">
                                <FileText className="w-3 h-3" /> Gerar Contrato
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* FASE 1: MANUTENÇÃO & COMBUSTÍVEL */}
            {subTab === 'FLEET' && (
              <div className="glass-panel p-6 rounded-2xl space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Wrench className="w-5 h-5 text-amber-400" /> Histórico de Manutenções & Revisões
                  </h2>
                  <p className="text-xs text-slate-400">Controle preventivo de troca de óleo, pneus e custos vinculados ao DRE.</p>
                </div>

                <div className="grid md:grid-cols-2 gap-4">
                  {maintenances.map(m => (
                    <div key={m.id} className="glass-card p-4 rounded-xl space-y-2">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span className="font-bold text-white text-xs">{m.description}</span>
                        <span className="text-xs font-extrabold text-red-400">R$ {m.cost.toLocaleString('pt-BR')}</span>
                      </div>
                      <div className="text-xs text-slate-400 space-y-1">
                        <div>Oficina: <strong>{m.workshopName}</strong></div>
                        <div>Km no Serviço: {m.kmAtService.toLocaleString('pt-BR')} km • Próxima Revisão: <strong className="text-amber-400">{m.nextDueKm.toLocaleString('pt-BR')} km</strong></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* FASE 2: CRM KANBAN & CONTRATOS */}
            {subTab === 'CRM' && (
              <div className="glass-panel p-6 rounded-2xl space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Users className="w-5 h-5 text-blue-400" /> CRM de Captação & Kanban de Vendas
                  </h2>
                  <p className="text-xs text-slate-400">Funil de interessados em transporte escolar e fretes.</p>
                </div>

                <div className="grid md:grid-cols-4 gap-4">
                  {['NEW', 'PROPOSAL_SENT', 'NEGOTIATING', 'WON'].map(status => (
                    <div key={status} className="bg-slate-900/80 p-4 rounded-xl border border-slate-800 space-y-3">
                      <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider border-b border-slate-800 pb-2">
                        {status === 'NEW' ? 'Novo Lead (2)' : status === 'PROPOSAL_SENT' ? 'Proposta Enviada (1)' : status === 'NEGOTIATING' ? 'Em Negociação' : 'Fechado / Ativo'}
                      </h3>
                      {crmLeads.filter(l => l.status === status || (status === 'NEW' && l.status === 'NEW')).map(l => (
                        <div key={l.id} className="glass-card p-3 rounded-lg space-y-1 text-xs">
                          <strong className="text-white block">{l.parentName}</strong>
                          <p className="text-slate-400">{l.schoolName} ({l.neighborhood})</p>
                          <span className="text-[10px] text-emerald-400 font-medium block">Tel: {l.phone}</span>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>

                {/* Contratos Digitais Gerados */}
                <div className="border-t border-slate-800 pt-4 space-y-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <FileText className="w-4 h-4 text-emerald-400" /> Contratos Digitais Ativos ({contracts.length})
                  </h3>
                  <div className="grid md:grid-cols-2 gap-3">
                    {contracts.map(c => (
                      <div key={c.id} className="p-3 bg-slate-900 border border-slate-800 rounded-xl text-xs space-y-1">
                        <div className="flex justify-between font-bold text-white">
                          <span>{c.contractNumber} — {c.studentName}</span>
                          <span className="text-emerald-400">R$ {c.monthlyValue}/mês</span>
                        </div>
                        <p className="text-slate-400">Vencimento: Todo dia {c.dueDay} • Vigência até {c.endDate}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* FASE 3: DISPARADOR WHATSAPP */}
            {subTab === 'WHATSAPP' && (
              <div className="glass-panel p-6 rounded-2xl space-y-6">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <MessageSquare className="w-5 h-5 text-emerald-400" /> Fila de Notificações WhatsApp
                  </h2>
                  <p className="text-xs text-slate-400">Mensagens automáticas de cobrança Pix e alertas de embarque.</p>
                </div>

                <div className="space-y-3">
                  {notifications.map(n => (
                    <div key={n.id} className="p-4 bg-slate-900 border border-slate-800 rounded-xl flex items-start justify-between text-xs">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className="font-bold text-white">{n.recipientName}</span>

            {occurrences.length > 0 && (
              <div className="glass-panel p-4 rounded-2xl space-y-2 border border-amber-500/30">
                <span className="text-[11px] font-bold text-amber-400 flex items-center gap-1">
                  <AlertCircle className="w-4 h-4" /> Alerta de Rota em Tempo Real:
                </span>
                {occurrences.map(o => (
                  <div key={o.id} className="text-xs text-slate-300 bg-slate-950 p-3 rounded-xl space-y-1">
                    <div className="font-bold text-white">{o.driverName} relatou: {o.type === 'TRAFFIC' ? 'Trânsito' : o.type === 'BREAKDOWN' ? 'Quebra' : o.type === 'ACCIDENT' ? 'Acidente' : o.type === 'BEHAVIOR' ? 'Comportamento' : o.type === 'DELAY' ? 'Atraso' : 'Outro'}</div>
                    <p className="text-slate-400">{o.description}</p>
                    <span className="text-[10px] text-amber-300 font-semibold block">Previsão de Atraso: +{o.estimatedDelayMinutes} minutos</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      // Modal de Autenticação Multi-Perfil
      function AuthModal({ isOpen, onClose, onLoginSuccess }) {
        const [role, setRole] = useState('OWNER');
        const [credential, setCredential] = useState('admin@transvan.com.br');

        if (!isOpen) return null;

        const handleSubmit = async (e) => {
          e.preventDefault();
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role, emailOrPinOrCpf: credential }),
          });
          const data = await res.json();
          alert(`🔓 Autenticado como ${data.user.name} (${data.user.role})! Token ativado.`);
          onLoginSuccess(data.user.role);
          onClose();
        };

        return (
          <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
            <form onSubmit={handleSubmit} className="glass-panel p-6 rounded-2xl max-w-sm w-full space-y-4">
              <h3 className="font-bold text-white text-lg flex items-center gap-2">
                <Lock className="w-5 h-5 text-emerald-400" /> Login Multi-Perfil (SaaS)
              </h3>
              <div className="space-y-3 text-xs">
                <div>
                  <label className="text-slate-300 block mb-1">Perfil de Acesso:</label>
                  <select value={role} onChange={e => {
                    const r = e.target.value;
                    setRole(r);
                    setCredential(r === 'OWNER' ? 'admin@transvan.com.br' : r === 'DRIVER' ? '1234' : '123.456.789-00');
                  }} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-bold">
                    <option value="OWNER">Frotista / Administrador</option>
                    <option value="DRIVER">Motorista (Acesso via PIN)</option>
                    <option value="ASSISTANT">Auxiliar de Van (Monitor)</option>
                    <option value="PARENT">Pais / Família (CPF)</option>
                  </select>
                </div>
                <div>
                  <label className="text-slate-300 block mb-1">
                    {role === 'OWNER' ? 'E-mail:' : role === 'PARENT' ? 'CPF do Responsável:' : 'PIN Secreto (4 dígitos):'}
                  </label>
                  <input required type="text" value={credential} onChange={e => setCredential(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white font-mono" />
                </div>
              </div>
              <div className="flex gap-2 pt-2">
                <button type="button" onClick={onClose} className="w-full py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">Cancelar</button>
                <button type="submit" className="w-full py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold glow-emerald">Entrar no Sistema</button>
              </div>
            </form>
          </div>
        );
      }

      // App Main
      function App() {
        const [tab, setTab] = useState('OWNER');
        const [showAuthModal, setShowAuthModal] = useState(false);

        return (
          <div className="min-h-screen bg-[#090d16] text-slate-100 flex flex-col">
            <header className="border-b border-slate-800 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
              <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg glow-emerald">
                    <Bus className="w-6 h-6 text-slate-950 stroke-[2.5]" />
                  </div>
                  <span className="font-extrabold text-xl tracking-tight text-white">Van<span className="text-emerald-400">Pro</span></span>
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={() => setShowAuthModal(true)} className="flex items-center gap-1 px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 rounded-xl text-xs font-bold">
                    <Lock className="w-3.5 h-3.5 text-emerald-400" /> Login
                  </button>
                  <div className="flex items-center gap-1 bg-slate-900 border border-slate-800 p-1 rounded-xl">
                    <button onClick={() => setTab('OWNER')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === 'OWNER' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Frotista</button>
                    <button onClick={() => setTab('DRIVER')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === 'DRIVER' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Motorista</button>
                    <button onClick={() => setTab('ASSISTANT')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === 'ASSISTANT' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Auxiliar</button>
                    <button onClick={() => setTab('PARENT')} className={`px-3 py-1.5 rounded-lg text-xs font-bold ${tab === 'PARENT' ? 'bg-emerald-600 text-white' : 'text-slate-400'}`}>Pais</button>
                  </div>
                </div>
              </div>
            </header>

            <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
              {tab === 'OWNER' && <OwnerDashboard />}
              {tab === 'DRIVER' && <DriverAppView />}
              {tab === 'ASSISTANT' && <AssistantAppView />}
              {tab === 'PARENT' && <ParentAppView />}
            </main>

            <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} onLoginSuccess={(role) => setTab(role)} />
          </div>
        );
      }

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
